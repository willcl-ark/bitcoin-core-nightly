name: macOS static initialization matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducer:
    name: Minimal inline-map reproducer with Clang ${{ matrix.clang }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - clang: 21
            shell: ./bix
            nixpkgs: github:NixOS/nixpkgs/d6524aaca2ff07876657ae2b323f24be4874944b
          - clang: 22
            shell: ./bix#clang
            nixpkgs: github:NixOS/nixpkgs/d6524aaca2ff07876657ae2b323f24be4874944b
          - clang: 23
            shell: ./bix#clang
            nixpkgs: github:NixOS/nixpkgs/nixos-unstable
    steps:
      - uses: actions/checkout@v6
        with:
          repository: bitcoin-dev-tools/bix
          ref: b0ff4bac97eeacddd37f6f7b97409a4a2919de50
          path: bix
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          extra-conf: |
            lazy-trees = true
            fallback = true
            extra-platforms = x86_64-darwin
      - name: Compile reproducer
        run: |
          nix_shell="${{ matrix.shell }}"
          # shellcheck disable=SC2016
          nix develop "$nix_shell" --system aarch64-darwin \
            --override-input nixpkgs "${{ matrix.nixpkgs }}" \
            --command bash -euc '
            set -exo pipefail
            mkdir repro
            printf "%s\n" \
              "#include <map>" \
              "#include <string>" \
              "enum class Flag { A };" \
              "inline const std::map<Flag, std::string> A{{Flag::A, \"x\"}};" \
              "inline const std::map<std::string, Flag> B{{A.at(Flag::A), Flag::A}};" \
              > repro/maps.h
            clang++ --version
            ld -v || true
            common_flags=(-std=c++17 -O2 -g -fvisibility-inlines-hidden \
              -arch arm64 -isysroot "$SDKROOT" -mmacosx-version-min=14.0 \
              -Wl,-dead_strip -Wl,-dead_strip_dylibs -fstack-protector-all \
              -Wl,-fixup_chains -fPIE -Xlinker -pie)
            first_failure=0
            for count in 2 4 8 16 32 64 128; do
              rm -f repro/tu*.cpp repro/maps.cpp repro/maps
              for i in $(seq 1 "$count"); do
                printf "%s\n" "#include \"maps.h\"" \
                  "std::string filler_$i = \"$i\";" > "repro/tu$i.cpp"
              done
              printf "%s\n" "#include \"maps.h\"" \
                "int main() { return B.size() != 1; }" > repro/maps.cpp
              clang++ "${common_flags[@]}" repro/tu*.cpp repro/maps.cpp \
                -o repro/maps
              set +e
              repro/maps
              status=$?
              set -e
              echo "translation units: $count, status: $status"
              if [ "$status" -ne 0 ]; then
                first_failure=$count
                break
              fi
            done
            test "$first_failure" -ne 0
            echo "first failing translation-unit count: $first_failure"
          '
