name: TEMPORARY macOS create_cache debugger

on:
  workflow_dispatch:
    inputs:
      bitcoin_ref:
        description: Bitcoin Core ref to build
        required: true
        default: master
      bix_ref:
        description: Bix ref to use
        required: true
        default: master

permissions:
  contents: read

jobs:
  create-cache:
    name: create_cache under lldb
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout nightly repository
        uses: actions/checkout@v6

      - name: Checkout Bix
        uses: actions/checkout@v6
        with:
          repository: bitcoin-dev-tools/bix
          ref: ${{ inputs.bix_ref }}
          path: bix
          fetch-depth: 1

      - name: Checkout Bitcoin Core
        uses: actions/checkout@v6
        with:
          repository: bitcoin/bitcoin
          ref: ${{ inputs.bitcoin_ref }}
          path: bitcoin
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          extra-conf: |
            lazy-trees = true
            fallback = true
            extra-platforms = x86_64-darwin

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-dev-shell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update and record Bix toolchain
        working-directory: bix
        run: |
          nix flake update
          nix flake metadata --no-write-lock-file | tee "$GITHUB_WORKSPACE/bix-flake-metadata.txt"

      - name: Build Bitcoin Core and run create_cache under lldb
        run: |
          # shellcheck disable=SC2016
          nix develop ./bix --system aarch64-darwin --no-write-lock-file --command bash -euc '
            set -x
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

            cp CMakeUserPresets.json bitcoin/CMakeUserPresets.json
            cmake --preset darwin -S bitcoin
            cmake --build bitcoin/build --parallel 3

            cmake -S scripts/functional-ctest \
              -B build-functional-ctest \
              -DBITCOIN_BUILD_DIR="$GITHUB_WORKSPACE/bitcoin/build"

            LLDB="$(xcrun --find lldb)"
            {
              nix --version
              clang --version
              clang++ --version
              echo "LLDB=$LLDB"
              "$LLDB" --version
            } 2>&1 | tee "$GITHUB_WORKSPACE/toolchain.txt"

            "$LLDB" \
              --batch \
              --attach-name bitcoind \
              --wait-for \
              -o "breakpoint set --language-exception c++" \
              -o "continue" \
              -o "thread backtrace all" \
              -o "process status" \
              -o "process detach" \
              > "$GITHUB_WORKSPACE/lldb.log" 2>&1 &
            LLDB_PID=$!

            cleanup() {
              if kill -0 "$LLDB_PID" 2>/dev/null; then
                kill "$LLDB_PID" 2>/dev/null || true
                wait "$LLDB_PID" || true
              fi
            }
            trap cleanup EXIT

            ctest \
              --test-dir build-functional-ctest \
              --verbose \
              --output-on-failure \
              --tests-regex "^functional\\.create_cache$"
          '

      - name: Collect debug logs
        if: always()
        run: |
          mkdir -p artifacts
          cp -R build-functional-ctest artifacts/ 2>/dev/null || true
          cp -R "$HOME/Library/Logs/DiagnosticReports" artifacts/ 2>/dev/null || true
          cp lldb.log toolchain.txt bix-flake-metadata.txt artifacts/ 2>/dev/null || true

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-create-cache-debug
          path: artifacts
          if-no-files-found: warn
