name: TEMPORARY macOS create_cache debugger

on:
  workflow_dispatch:
    inputs:
      bitcoin_ref:
        description: Bitcoin Core ref to build
        required: true
        default: fc4f35fdce4d65696be6bf34003dbcac1f2f64bf
      bix_ref:
        description: Bix ref to use
        required: true
        default: b0ff4bac97eeacddd37f6f7b97409a4a2919de50
      nixpkgs_ref:
        description: Nixpkgs input to reproduce the toolchain
        required: true
        default: github:NixOS/nixpkgs/d6524aaca2ff07876657ae2b323f24be4874944b

permissions:
  contents: read

jobs:
  create-cache:
    name: create_cache under lldb
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NIXPKGS_REF: ${{ inputs.nixpkgs_ref }}

    steps:
      - name: Checkout nightly repository
        uses: actions/checkout@v6

      - name: Checkout Bix
        uses: actions/checkout@v6
        with:
          repository: bitcoin-dev-tools/bix
          ref: ${{ inputs.bix_ref }}
          path: bix
          fetch-depth: 1

      - name: Checkout Bitcoin Core
        uses: actions/checkout@v6
        with:
          repository: bitcoin/bitcoin
          ref: ${{ inputs.bitcoin_ref }}
          path: bitcoin
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          extra-conf: |
            lazy-trees = true
            fallback = true
            extra-platforms = x86_64-darwin

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-dev-shell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Record pinned Bix toolchain
        working-directory: bix
        run: |
          nix flake metadata --override-input nixpkgs "$NIXPKGS_REF" --json \
            | tee "$GITHUB_WORKSPACE/bix-flake-metadata.json"

      - name: Build Bitcoin Core and run create_cache under lldb
        run: |
          # shellcheck disable=SC2016
          nix develop ./bix --system aarch64-darwin \
            --override-input nixpkgs "$NIXPKGS_REF" --command bash -euc '
            set -x
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

            SYSTEM_DEVELOPER_DIR="$(env -u DEVELOPER_DIR /usr/bin/xcode-select --print-path)"
            APPLE_PATH="/usr/bin:/bin:/usr/sbin:/sbin"
            LLDB="$(PATH="$APPLE_PATH" DEVELOPER_DIR="$SYSTEM_DEVELOPER_DIR" \
              /usr/bin/xcrun --find lldb 2>/dev/null || true)"
            if [ ! -x "$LLDB" ]; then
              LLDB="$SYSTEM_DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/lldb"
            fi
            DEBUGSERVER="$(PATH="$APPLE_PATH" DEVELOPER_DIR="$SYSTEM_DEVELOPER_DIR" \
              /usr/bin/xcrun --find debugserver 2>/dev/null || true)"
            if [ ! -x "$DEBUGSERVER" ]; then
              DEBUGSERVER="$(find "$SYSTEM_DEVELOPER_DIR" -type f -name debugserver \
                -perm -111 -print -quit)"
            fi
            test -x "$LLDB"
            test -x "$DEBUGSERVER"
            export LLDB
            export LLDB_DEBUGSERVER_PATH="$DEBUGSERVER"
            {
              /usr/bin/sw_vers
              uname -a
              nix --version
              clang --version
              clang++ --version
              echo "SYSTEM_DEVELOPER_DIR=$SYSTEM_DEVELOPER_DIR"
              echo "LLDB=$LLDB"
              echo "LLDB_DEBUGSERVER_PATH=$LLDB_DEBUGSERVER_PATH"
              "$LLDB" --version
            } 2>&1 | tee "$GITHUB_WORKSPACE/toolchain.txt"

            cp CMakeUserPresets.json bitcoin/CMakeUserPresets.json
            cmake --preset darwin -S bitcoin
            cmake --build bitcoin/build --parallel 3
            /usr/bin/otool -L bitcoin/build/bin/bitcoind >> "$GITHUB_WORKSPACE/toolchain.txt"

            export BITCOIND="$GITHUB_WORKSPACE/bitcoin/build/bin/bitcoind"
            test_result=0
            for mode in plain lldb; do
              if [ "$mode" = lldb ]; then
                export BITCOIND="$GITHUB_WORKSPACE/scripts/debug-bitcoind.sh"
              fi
              cmake -S scripts/functional-ctest \
                -B "build-functional-$mode" \
                -DBITCOIN_BUILD_DIR="$GITHUB_WORKSPACE/bitcoin/build"

              ctest \
                --test-dir "build-functional-$mode" \
                --verbose \
                --output-on-failure \
                --tests-regex "^functional\\.create_cache$" || test_result=1
            done
            exit "$test_result"
          '

      - name: Collect debug logs
        if: always()
        run: |
          mkdir -p artifacts
          cp -R build-functional-plain build-functional-lldb artifacts/ 2>/dev/null || true
          cp -R "$HOME/Library/Logs/DiagnosticReports" artifacts/ 2>/dev/null || true
          cp lldb.log toolchain.txt bix-flake-metadata.json artifacts/ 2>/dev/null || true
          cp bitcoin/build/CMakeCache.txt bitcoin/build/build.ninja \
            bitcoin/build/compile_commands.json \
            bitcoin/build/CMakeFiles/CMakeConfigureLog.yaml artifacts/ 2>/dev/null || true
          if [ -f bitcoin/build/bin/bitcoind ]; then
            cp bitcoin/build/bin/bitcoind artifacts/
            /usr/bin/dsymutil bitcoin/build/bin/bitcoind -o artifacts/bitcoind.dSYM \
              > artifacts/dsymutil.log 2>&1
          fi

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-create-cache-debug
          path: artifacts
          if-no-files-found: warn
